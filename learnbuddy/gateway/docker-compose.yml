# learnbuddy Gateway + MySQL
# Usage (from learnbuddy/ root):
#   开发: cp gateway/.env.example gateway/.env
#   生产: cp gateway/.env.production.example gateway/.env.production
#         docker compose -f gateway/docker-compose.yml --env-file gateway/.env.production up -d --build
#   curl http://127.0.0.1:18765/health

services:
  mysql:
    image: mysql:8.4
    container_name: learnbuddy-gateway-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learnbuddy_gateway
      MYSQL_USER: learnbuddy
      MYSQL_PASSWORD: learnbuddy
    volumes:
      - gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ulearnbuddy', '-plearnbuddy']
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: learnbuddy/gateway:latest
    container_name: learnbuddy-gateway
    restart: unless-stopped
    ports:
      - '18765:18765'
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  gateway_mysql_data:
