<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EFF6FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/catbuddy_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/catbuddy_apple_touch.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Catbuddy</title>
    <script>
      (function () {
        try {
          var path = location.pathname;
          var isApp = path === "/app" || path.indexOf("/app/") === 0;
          if (!isApp) {
            document.documentElement.classList.add("dark");
            return;
          }
          var stored = localStorage.getItem("catbuddy-webui.theme");
          if (stored === "dark") document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <style>
      html, body, #root { height: 100dvh; max-height: 100dvh; }
      body { margin: 0; background: #171717; color: #fafafa; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
