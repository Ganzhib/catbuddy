version: "3.8"

services:
  # ── PostgreSQL 数据库 ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_postgres_2026
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Langfuse 服务 ──
  langfuse-web:
    image: ghcr.io/langfuse/langfuse:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_postgres_2026@postgres:5432/langfuse
      NEXTAUTH_SECRET: oHFfGJOdDsgpqqTDaOBNmKjeUqeyNl5suy436snb3rI=
      SALT: yErIWS5t3HfHO+0J5nwF2A==
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
