# Local MySQL for learnbuddy gateway
# Usage:
#   docker compose up -d
#   cp .env.example .env
#   pnpm run build && pnpm start

services:
  mysql:
    image: mysql:8.4
    container_name: learnbuddy-gateway-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learnbuddy_gateway
      MYSQL_USER: learnbuddy
      MYSQL_PASSWORD: learnbuddy
    volumes:
      - gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ulearnbuddy', '-plearnbuddy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gateway_mysql_data:
