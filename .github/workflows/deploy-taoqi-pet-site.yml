name: Deploy Taoqi Pet download site

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-taoqi-pet-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taoqi-pet-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://pet.ganzhibin.icu/
    env:
      DEPLOY_HOST: 150.158.27.165
      DEPLOY_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout public pet project
        uses: actions/checkout@v4
        with:
          repository: Ganzhib/taoqi-pet
          ref: main
          persist-credentials: false

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taoqi-site/media"
          cp site/index.html site/styles.css site/main.js "$RUNNER_TEMP/taoqi-site/"
          cp assets/icon.png "$RUNNER_TEMP/taoqi-site/media/icon.png"
          cp assets/pets/cat-*.gif "$RUNNER_TEMP/taoqi-site/media/"
          test "$(find "$RUNNER_TEMP/taoqi-site/media" -name 'cat-*.gif' | wc -l)" -eq 8
          for gif in "$RUNNER_TEMP"/taoqi-site/media/cat-*.gif; do
            test "$(head -c 6 "$gif")" = GIF89a
          done

      - name: Configure deployment SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/taoqi_deploy
          chmod 600 ~/.ssh/taoqi_deploy
          ssh -i ~/.ssh/taoqi_deploy -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" true

      - name: Upload site and configure Nginx
        shell: bash
        run: |
          set -euo pipefail
          ssh_args="-i $HOME/.ssh/taoqi_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3"
          echo "Creating the dedicated site directory"
          timeout 60 ssh $ssh_args "$DEPLOY_USER@$DEPLOY_HOST" 'install -d -m 755 /var/www/taoqi-pet'
          echo "Uploading the static site"
          timeout 180 rsync -rzc --delete --stats -e "ssh $ssh_args" "$RUNNER_TEMP/taoqi-site/" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/taoqi-pet/"
          echo "Configuring the Nginx virtual host"
          timeout 90 ssh $ssh_args "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          domain=pet.ganzhibin.icu
          config="/etc/nginx/sites-available/$domain"
          cat > "$config" <<'NGINX'
          server {
              listen 80;
              server_name pet.ganzhibin.icu;
              root /var/www/taoqi-pet;
              index index.html;

              location /.well-known/acme-challenge/ {
                  try_files $uri =404;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          ln -sfn "$config" "/etc/nginx/sites-enabled/$domain"
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Obtain and configure HTTPS certificate
        shell: bash
        run: |
          set -euo pipefail
          ssh_args="-i $HOME/.ssh/taoqi_deploy -o StrictHostKeyChecking=accept-new"
          ssh $ssh_args "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          domain=pet.ganzhibin.icu
          if ! test -s "/etc/letsencrypt/live/$domain/fullchain.pem"; then
            certbot certonly --webroot --webroot-path /var/www/taoqi-pet \
              -d "$domain" --non-interactive --agree-tos -m luli_0819@qq.com
          fi
          cat > "/etc/nginx/sites-available/$domain" <<'NGINX'
          server {
              listen 80;
              server_name pet.ganzhibin.icu;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name pet.ganzhibin.icu;
              root /var/www/taoqi-pet;
              index index.html;
              ssl_certificate /etc/letsencrypt/live/pet.ganzhibin.icu/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/pet.ganzhibin.icu/privkey.pem;

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify public site and animated assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://pet.ganzhibin.icu/ -o "$RUNNER_TEMP/taoqi-home.html"
          grep -q '淘气桌宠' "$RUNNER_TEMP/taoqi-home.html"
          curl --fail --silent --show-error https://pet.ganzhibin.icu/media/cat-study.gif \
            -o "$RUNNER_TEMP/cat-study.gif"
          test "$(head -c 6 "$RUNNER_TEMP/cat-study.gif")" = GIF89a
