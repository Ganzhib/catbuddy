<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/nanobot_favicon_32.png" />
    <link rel="icon" type="image/png" sizes="73x75" href="/brand/nanobot_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/nanobot_apple_touch.png" />
    <title>nanobot</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nanobot-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #171717; color: #fafafa; font-family: system-ui, -apple-system, sans-serif; }
      .boot-splash { display: flex; height: 100%; align-items: center; justify-content: center; }
      .boot-splash-inner { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.5); font-size: 14px; }
      .boot-dot { width: 8px; height: 8px; border-radius: 9999px; background: currentColor; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { transform: scale(0.9); opacity: 0.45; }
        50% { transform: scale(1); opacity: 0.85; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot"></span>
          <span>Loading nanobot…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
