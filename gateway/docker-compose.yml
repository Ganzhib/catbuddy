# catbuddy Gateway + MySQL
# Usage (from catbuddy/ root):
#   开发: cp .env.example .env
#   生产: cp .env.production.example .env.production
#         docker compose -f gateway/docker-compose.yml --env-file .env.production up -d --build
#   curl http://127.0.0.1:18765/health

services:
  mysql:
    image: mysql:8.4
    container_name: catbuddy-gateway-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catbuddy_gateway}
      MYSQL_USER: ${MYSQL_USER:-catbuddy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-catbuddy}
    volumes:
      - gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: catbuddy/gateway:latest
    container_name: catbuddy-gateway
    restart: unless-stopped
    ports:
      - '18765:18765'
    env_file:
      - ${GATEWAY_ENV_FILE:-../.env.production}
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  gateway_mysql_data:
