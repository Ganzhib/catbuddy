name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - gateway
          - web

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  scope:
    name: Detect deployment scope
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.scope.outputs.gateway }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - name: Download scope from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deployment-scope
          path: ${{ runner.temp }}/deployment-scope
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read deployment scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gateway=false
            web=false
            case "${MANUAL_TARGET:-all}" in
              all)
                gateway=true
                web=true
                ;;
              gateway)
                gateway=true
                ;;
              web)
                web=true
                ;;
              *)
                echo "Unknown deployment target: $MANUAL_TARGET" >&2
                exit 1
                ;;
            esac
          else
            manifest="$RUNNER_TEMP/deployment-scope/deployment-scope.json"
            gateway="$(node -p "require(process.argv[1]).gateway" "$manifest")"
            web="$(node -p "require(process.argv[1]).web" "$manifest")"
          fi
          printf 'gateway=%s\nweb=%s\n' "$gateway" "$web" | tee -a "$GITHUB_OUTPUT"

  deploy:
    name: Deploy affected services
    needs: scope
    if: needs.scope.outputs.gateway == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      DEPLOY_HOST: 150.158.27.165
      DEPLOY_USER: root
      DEPLOY_PORT: "22"
      GATEWAY_REMOTE_DIR: /opt/catbuddy/gateway
      GATEWAY_DOMAIN: gateway.ganzhibin.icu
      WEB_REMOTE_DIR: /opt/catbuddy/web
      WEB_DOMAIN: catbuddy.ganzhibin.icu
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "Missing production secret: DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          if [[ "${{ needs.scope.outputs.gateway }}" == "true" && -z "$PRODUCTION_ENV" ]]; then
            echo "Missing production secret: PRODUCTION_ENV" >&2
            exit 1
          fi

      - name: Prepare deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/catbuddy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/catbuddy-ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/catbuddy-ssh/deploy_key"
          if [[ "${{ needs.scope.outputs.gateway }}" == "true" ]]; then
            printf '%s\n' "$PRODUCTION_ENV" > .env.production
          fi

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const config = {
            host: process.env.DEPLOY_HOST,
            user: process.env.DEPLOY_USER,
            port: Number(process.env.DEPLOY_PORT),
            identityFile: path.join(process.env.RUNNER_TEMP, 'catbuddy-ssh', 'deploy_key'),
            remoteDir: process.env.GATEWAY_REMOTE_DIR,
            domain: process.env.GATEWAY_DOMAIN,
            envFile: '.env.production',
            build: true,
            setupNginx: false,
            webDomain: process.env.WEB_DOMAIN,
            webRemoteDir: process.env.WEB_REMOTE_DIR,
          }

          fs.writeFileSync('deploy/deploy.config.json', `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Deploy Gateway
        if: needs.scope.outputs.gateway == 'true'
        run: pnpm deploy:gateway

      - name: Verify Gateway
        if: needs.scope.outputs.gateway == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "https://$GATEWAY_DOMAIN/health"; then
              echo
              exit 0
            fi
            echo "Gateway health check $attempt/12 failed; retrying..."
            sleep 5
          done
          echo "Gateway health check failed" >&2
          exit 1

      - name: Build Web
        if: needs.scope.outputs.web == 'true'
        run: pnpm build:web:only

      - name: Deploy Web
        if: needs.scope.outputs.web == 'true'
        run: node deploy/deploy-web.cjs --skip-build --skip-cert

      - name: Verify Web
        if: needs.scope.outputs.web == 'true'
        run: curl --fail --silent --show-error --max-time 15 "https://$WEB_DOMAIN/" > /dev/null

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: |
          rm -f .env.production deploy/deploy.config.json
          rm -rf "$RUNNER_TEMP/catbuddy-ssh"
